[project]
name = "music-hive"
version = "0.1.0"
description = "music-hive — self-hosted музыкальный сервер и умный плеер"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "mutagen>=1.47.0",
  "numpy>=2.0.0",
  "soundfile>=0.12.1",
  "librosa>=0.10.2",
  "pyloudnorm>=0.1.1",
  "tinytag>=1.10.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "watchdog>=4.0.0",
  "pydantic-settings>=2.6.0",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.30.0",
  # F1.4: PostgreSQL-режим воркера (MUSIC_HIVE_DATABASE_URL). Основная группа:
  # psycopg лёгкий (~1 МБ wheels), альтернативная extra ради него — ложный выбор;
  # pgvector нужен для адаптера vector<->np.ndarray.
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3.6",
]

[project.optional-dependencies]
# easydict — только для unit-теста _patch_easydict_attn model-server
# (в проде его тянет muq как зависимость); transformers 5.x drift, #32.
dev = ["pytest>=8.0.0", "easydict>=1.10"]
# chromaprint system package required for fingerprinting (pyacoustid)
fingerprint = ["pyacoustid>=1.3.0"]
# F4.2 (#28): ONNX-бэкенд энкодера (MUSIC_HIVE_EMBEDDING_MODEL=onnx:<имя>).
# onnxruntime — инференс (CPU); onnx — сборка графов (тесты/toy-модели, экспорт).
onnx = ["onnxruntime>=1.18", "onnx>=1.16"]

[project.scripts]
music-hive = "music_hive.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Конфиги ONNX-моделей (weights *.onnx не поставляются — экспортируются
# локально scripts/export_clap_onnx.py). В wheel падают в <prefix>/models.d/onnx,
# encoder ищет их там же (env MUSIC_HIVE_ONNX_DIR перекрывает).
[tool.setuptools.data-files]
"models.d/onnx" = ["models.d/onnx/clap-reference.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
