<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Music Hive — архитектура</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#080b12;
      --panel:#141d2a;
      --line:#314058;
      --ink:#f7f9fc;
      --muted:#8997aa;
      --mint:#62f2d0;
      --blue:#55b9ff;
      --orange:#ffb45f;
      --violet:#a28aff;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:Onest,sans-serif; }
    body {
      display:grid;
      place-items:center;
      background:
        radial-gradient(800px 600px at 15% 85%,rgba(98,242,208,.1),transparent 65%),
        radial-gradient(800px 600px at 88% 10%,rgba(85,185,255,.08),transparent 65%),
        var(--bg);
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:40px 40px;
      pointer-events:none;
    }
    .stage {
      position:relative;
      width:min(94vw,1770px);
      height:min(92vh,980px);
      overflow:hidden;
      border:1px solid rgba(67,84,111,.46);
      border-radius:32px;
      background:
        radial-gradient(circle at 50% 50%,rgba(85,185,255,.055),transparent 55%),
        rgba(11,16,25,.9);
      box-shadow:0 40px 120px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.035);
    }
    .stage::before {
      content:"";
      position:absolute;
      left:5%;
      right:5%;
      top:22%;
      height:1px;
      background:linear-gradient(90deg,transparent,#263247,transparent);
    }
    .links { position:absolute; inset:0; z-index:1; width:100%; height:100%; overflow:visible; }
    .link {
      fill:none;
      stroke:#42536d;
      stroke-width:4;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:900;
      stroke-dashoffset:900;
    }
    .link.prepare { stroke:var(--orange); }
    .link.model { stroke:var(--violet); }
    .link.store { stroke:var(--mint); }
    .link.runtime { stroke:var(--blue); }
    .link.client { stroke:#b1bdcc; }
    .node {
      position:absolute;
      z-index:5;
      display:grid;
      place-items:center;
      text-align:center;
      border:1px solid var(--line);
      border-radius:22px;
      background:linear-gradient(145deg,#182332,#111823);
      box-shadow:0 20px 55px rgba(0,0,0,.28);
      opacity:0;
    }
    .node b { display:block; font:700 clamp(16px,1.35vw,24px)/1.1 "IBM Plex Mono",monospace; }
    .node small { display:block; margin-top:9px; color:var(--muted); font-size:clamp(11px,.85vw,14px); }
    .icon {
      width:47px;
      height:47px;
      display:grid;
      place-items:center;
      margin:0 auto 13px;
      border-radius:14px;
      color:#0b1515;
      background:var(--mint);
      font:800 16px/1 "IBM Plex Mono",monospace;
      box-shadow:0 0 25px rgba(98,242,208,.25);
    }
    .client-node { top:6%; width:15%; height:12%; }
    .web { left:18%; }
    .mobile { left:42.5%; }
    .http { left:67%; }
    .client-node .icon { width:34px; height:34px; margin-bottom:8px; color:#101722; background:#b7c2d0; box-shadow:none; }
    .go {
      left:42.5%;
      top:27%;
      width:15%;
      height:17%;
      border-color:rgba(85,185,255,.55);
      box-shadow:0 0 55px rgba(85,185,255,.08);
    }
    .go .icon { color:#08131b; background:var(--blue); box-shadow:0 0 28px rgba(85,185,255,.3); }
    .db {
      left:14%;
      top:48%;
      width:16%;
      height:16%;
      border-color:rgba(98,242,208,.5);
    }
    .python {
      left:42%;
      top:51%;
      width:17%;
      height:18%;
      border-color:rgba(255,180,95,.55);
    }
    .python .icon { color:#1d1207; background:var(--orange); box-shadow:0 0 28px rgba(255,180,95,.3); }
    .clap {
      left:14%;
      top:75%;
      width:16%;
      height:15%;
      border-color:rgba(162,138,255,.55);
    }
    .clap .icon { color:#100b20; background:var(--violet); box-shadow:0 0 28px rgba(162,138,255,.3); }
    .music {
      left:66%;
      top:75%;
      width:17%;
      height:15%;
      border-color:rgba(98,242,208,.55);
    }
    .zone-label {
      position:absolute;
      z-index:7;
      padding:8px 12px;
      border:1px solid rgba(72,88,113,.45);
      border-radius:999px;
      color:#7f8da1;
      background:#101722;
      font:600 10px/1 "IBM Plex Mono",monospace;
      letter-spacing:.1em;
      opacity:0;
    }
    .heavy { left:32%; bottom:4%; }
    .fast { right:24%; top:23%; color:var(--blue); }
    .packet {
      position:absolute;
      z-index:9;
      width:16px;
      height:16px;
      border-radius:50%;
      background:currentColor;
      box-shadow:0 0 18px currentColor;
      opacity:0;
    }
    .packet.audio { color:var(--mint); }
    .packet.vector { color:var(--violet); }
    .packet.api { color:var(--blue); }
    .packet.meta { color:var(--orange); }
    .stage.active .music { animation:nodeIn .6s .3s both,musicBeat 2.4s 1s ease-in-out infinite,floatBlockA 6.5s 1s ease-in-out infinite alternate; }
    .stage.active .music-python { animation:draw 1s .9s forwards; }
    .stage.active .python { animation:nodeIn .6s 1.65s both,floatBlockB 7s 2.4s ease-in-out infinite alternate; }
    .stage.active .python-clap { animation:draw .9s 2.2s forwards; }
    .stage.active .clap { animation:nodeIn .55s 2.85s both,floatBlockC 6.8s 3.6s ease-in-out infinite alternate; }
    .stage.active .clap-python { animation:draw .9s 3.3s forwards; }
    .stage.active .python-db { animation:draw .9s 3.85s forwards; }
    .stage.active .db { animation:nodeIn .55s 4.5s both,floatBlockB 7.4s 5.2s ease-in-out infinite alternate; }
    .stage.active .heavy { animation:chipIn .45s 4.9s both; }
    .stage.active .go { animation:nodeIn .6s 5.25s both,goGlow 2.2s 6.2s ease-in-out infinite,floatBlockA 6.2s 6.2s ease-in-out infinite alternate; }
    .stage.active .go-db { animation:draw .8s 5.8s forwards; }
    .stage.active .go-python { animation:draw .8s 6.05s forwards; }
    .stage.active .go-music { animation:draw 1s 6.3s forwards; }
    .stage.active .fast { animation:chipIn .45s 6.75s both; }
    .stage.active .web { animation:nodeIn .5s 7.1s both,floatBlockC 7s 7.8s ease-in-out infinite alternate; }
    .stage.active .mobile { animation:nodeIn .5s 7.3s both,floatBlockA 6.6s 8s ease-in-out infinite alternate; }
    .stage.active .http { animation:nodeIn .5s 7.5s both,floatBlockB 7.3s 8.2s ease-in-out infinite alternate; }
    .stage.active .client-web { animation:draw .75s 7.8s forwards; }
    .stage.active .client-mobile { animation:draw .75s 8s forwards; }
    .stage.active .client-http { animation:draw .75s 8.2s forwards; }
    .replay {
      position:fixed;
      right:24px;
      bottom:19px;
      color:#566378;
      font:600 10px/1 "IBM Plex Mono",monospace;
      letter-spacing:.08em;
      user-select:none;
    }
    @keyframes nodeIn {
      from { opacity:0; transform:translateY(25px) scale(.76); filter:blur(8px); }
      to { opacity:1; transform:none; filter:none; }
    }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes chipIn { from { opacity:0; transform:translateY(12px) scale(.9); } to { opacity:1; transform:none; } }
    @keyframes musicBeat {
      0%,100% { box-shadow:0 0 0 rgba(98,242,208,0); }
      50% { box-shadow:0 0 45px rgba(98,242,208,.2); }
    }
    @keyframes goGlow {
      0%,100% { box-shadow:0 0 20px rgba(85,185,255,.05); }
      50% { box-shadow:0 0 60px rgba(85,185,255,.25); }
    }
    @keyframes floatBlockA {
      from { transform:translate(-5px,7px) rotate(-.25deg); }
      to { transform:translate(7px,-8px) rotate(.3deg); }
    }
    @keyframes floatBlockB {
      from { transform:translate(6px,-5px) rotate(.3deg); }
      to { transform:translate(-7px,8px) rotate(-.25deg); }
    }
    @keyframes floatBlockC {
      from { transform:translate(-4px,-7px) rotate(.2deg); }
      to { transform:translate(8px,6px) rotate(-.3deg); }
    }
    @keyframes audioFlow {
      0% { left:73%; top:78%; opacity:0; }
      18% { opacity:1; }
      48% { left:56%; top:59%; opacity:1; }
      72% { left:52%; top:40%; opacity:1; }
      100% { left:72%; top:12%; opacity:0; }
    }
    @keyframes vectorFlow {
      0% { left:25%; top:79%; opacity:0; }
      18% { opacity:1; }
      50% { left:43%; top:59%; opacity:1; }
      100% { left:25%; top:54%; opacity:0; }
    }
    @keyframes metaFlow {
      0% { left:50%; top:59%; opacity:0; }
      20% { opacity:1; }
      100% { left:25%; top:54%; opacity:0; }
    }
    @keyframes apiFlow {
      0% { left:50%; top:34%; opacity:0; }
      20% { opacity:1; }
      55% { left:50%; top:13%; opacity:1; }
      100% { left:26%; top:12%; opacity:0; }
    }
    @media (max-width:900px) {
      .node small,.zone-label { display:none; }
      .node { border-radius:14px; }
      .icon { width:32px; height:32px; margin-bottom:7px; font-size:11px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; }
    }
  </style>
</head>
<body>
  <div class="stage active" id="stage">
    <svg class="links" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <marker id="mintArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#62f2d0"/></marker>
        <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#55b9ff"/></marker>
        <marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#ffb45f"/></marker>
        <marker id="violetArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#a28aff"/></marker>
        <marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#b1bdcc"/></marker>
      </defs>
      <path class="link prepare music-python" d="M1055 735C965 690 930 635 850 610" marker-end="url(#orangeArrow)"/>
      <path class="link model python-clap" d="M675 560C575 600 555 715 480 735" marker-end="url(#violetArrow)"/>
      <path class="link model clap-python" d="M480 770C575 750 600 640 675 610" marker-end="url(#violetArrow)"/>
      <path class="link store python-db" d="M675 520C595 500 550 505 480 510" marker-end="url(#mintArrow)"/>
      <path class="link runtime go-db" d="M680 340C590 370 550 445 480 475" marker-end="url(#blueArrow)"/>
      <path class="link runtime go-python" d="M800 396V458" marker-end="url(#blueArrow)"/>
      <path class="link runtime go-music" d="M920 350C1045 410 1120 540 1160 675" marker-end="url(#blueArrow)"/>
      <path class="link client client-web" d="M408 162C475 205 570 260 680 290" marker-end="url(#grayArrow)"/>
      <path class="link client client-mobile" d="M800 162V243" marker-end="url(#grayArrow)"/>
      <path class="link client client-http" d="M1192 162C1120 210 1030 255 920 290" marker-end="url(#grayArrow)"/>
    </svg>

    <div class="node client-node web"><div><div class="icon">WEB</div><b>Web UI</b></div></div>
    <div class="node client-node mobile"><div><div class="icon">APP</div><b>Mobile</b></div></div>
    <div class="node client-node http"><div><div class="icon">HTTP</div><b>Player</b></div></div>

    <div class="node go"><div><div class="icon">GO</div><b>Go player</b><small>API · радио · стриминг</small></div></div>
    <div class="node db"><div><div class="icon">DB</div><b>SQLite</b><small>метаданные · векторы</small></div></div>
    <div class="node python"><div><div class="icon">PY</div><b>Python worker</b><small>индексация · миксы</small></div></div>
    <div class="node clap"><div><div class="icon">AI</div><b>CLAP</b><small>аудио → 512 чисел</small></div></div>
    <div class="node music"><div><div class="icon">♫</div><b>Music</b><small>файлы на диске</small></div></div>

    <span class="zone-label heavy">ТЯЖЁЛАЯ ПОДГОТОВКА</span>
    <span class="zone-label fast">БЫСТРЫЙ КОНТУР</span>
  </div>
  <div class="replay">КЛИК · ПОВТОРИТЬ &nbsp; F · ПОЛНЫЙ ЭКРАН</div>

  <script>
    const stage = document.getElementById("stage");
    function replay() {
      stage.classList.remove("active");
      void stage.offsetWidth;
      stage.classList.add("active");
    }
    stage.addEventListener("click", replay);
    addEventListener("keydown", event => {
      if (event.key === " " || event.key.toLowerCase() === "r") {
        event.preventDefault();
        replay();
      } else if (event.key.toLowerCase() === "f") {
        document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      }
    });
  </script>
</body>
</html>
