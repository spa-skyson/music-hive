openapi: 3.0.3
info:
  title: music-hive API
  version: 1.0.0
  description: >-
    Local CLAP-powered music player API. PostgreSQL mode (MUSIC_HIVE_DATABASE_URL):
    multi-user auth — argon2id login, server sessions (cookie music_hive_session),
    per-user Bearer tokens `mht_*`.
servers:
- url: http://127.0.0.1:8787
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: music_hive_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
    Track:
      type: object
      properties:
        id:
          type: integer
        artist:
          type: string
        title:
          type: string
        album:
          type: string
        duration:
          type: number
        stream:
          type: string
        artwork:
          type: string
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /api/health:
    get:
      security: []
      summary: Health
      responses:
        '200':
          description: OK
  /api/auth/login:
    post:
      security: []
      summary: Login with username and password (PostgreSQL multi-user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Player username (required)
                username:
                  type: string
                  description: Player username (required)
                password:
                  type: string
              required: [username, password]
      responses:
        '200':
          description: Sets music_hive_session cookie (HttpOnly, SameSite=Lax; server-side session, TTL 14d); returns {ok, user}
        '401':
          description: Bad credentials
        '429':
          description: Rate limited (per IP+username)
  /api/auth/logout:
    post:
      summary: Logout (deletes the server-side session where supported)
      responses:
        '200':
          description: OK
  /api/auth/me:
    get:
      security: []
      summary: 'Auth status: {ok, auth_enabled, id, username, is_admin, is_owner}'
      responses:
        '200':
          description: '{ok, auth_enabled, id, username, is_admin, is_owner}; ok=false without a session'
  /api/auth/subsonic-password:
    put:
      summary: Set own Subsonic password (PostgreSQL only). Independent from the main argon2id password; used by /rest/* token+salt and p= authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Clear Subsonic password; stored as md5 (users.subsonic_md5) and AES-GCM-encrypted (users.subsonic_password_enc)
      responses:
        '200':
          description: '{ok, username}'
        '400':
          description: Bad json or password length outside 1..256
        '401':
          description: Unauthorized
  /api/auth/tokens:
    post:
      summary: Create a per-user API token (PostgreSQL only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: '{ok, token, name} — token (mht_…) is shown once'
        '401':
          description: Unauthorized
    get:
      summary: List own API tokens — name, prefix, dates; no secrets (PostgreSQL only)
      responses:
        '200':
          description: '{ok, tokens: [{id, name, prefix, created_at, last_used_at?}]}'
        '401':
          description: Unauthorized
  /api/auth/tokens/{id}:
    delete:
      summary: Revoke own API token by id (PostgreSQL only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: '{ok}'
        '401':
          description: Unauthorized
        '404':
          description: No such token for this user
  /api/admin/users:
    get:
      summary: List users without password hashes (admin only, PostgreSQL only)
      responses:
        '200':
          description: '{ok, users: [{id, username, is_admin, is_owner, disabled, created_at}]}'
        '401':
          description: Unauthorized
        '403':
          description: Authenticated but not an admin
    post:
      summary: Create a user with argon2id password (admin only, PostgreSQL only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9_-]{3,32}$'
                password:
                  type: string
                is_admin:
                  type: boolean
                  default: false
      responses:
        '200':
          description: '{ok, user}'
        '400':
          description: Bad username / empty password / username taken
        '401':
          description: Unauthorized
        '403':
          description: Authenticated but not an admin
  /api/admin/users/{id}:
    patch:
      summary: >-
        Update a user — disable/enable (sessions revoked immediately), reset
        password, grant/revoke admin. The owner cannot be disabled or demoted
        (400). Admin only, PostgreSQL only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled:
                  type: boolean
                password:
                  type: string
                is_admin:
                  type: boolean
      responses:
        '200':
          description: '{ok, user}'
        '400':
          description: Owner protected / empty patch / bad input
        '401':
          description: Unauthorized
        '403':
          description: Authenticated but not an admin
        '404':
          description: User not found
  /api/admin/models:
    get:
      summary: >-
        Embedding model registry snapshot (admin only) — always proxied to the
        worker as an instant model_status job and polled to done (~10s): vector
        counters per dynamic emb_<slug> table live in the worker. PostgreSQL
        only; unreachable worker answers 503.
      responses:
        '200':
          description: '{active, models: [{key, dim, active, vectors}], pending}'
        '401':
          description: Unauthorized
        '403':
          description: Authenticated but not an admin
        '503':
          description: Worker unreachable — start `music-hive worker`
  /api/admin/models/activate:
    post:
      summary: >-
        Switch the active embedding model (admin only): enqueues a
        model_activate job {model_key} — worker re-embeds the delta, activates
        the model atomically and recomputes per-user taste; the player reloads
        vectors when the job finishes. Track progress via GET /api/jobs/{id}.
        PostgreSQL only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  maxLength: 256
                  description: 'model_key in <kind>:<name> form, e.g. onnx:mini-lm'
      responses:
        '202':
          description: '{ok, job_id, status: pending[, via: local_db]}'
        '400':
          description: Bad key (must be <kind>:<name>) / bad json
        '401':
          description: Unauthorized
        '403':
          description: Authenticated but not an admin
        '503':
          description: Worker unreachable and local enqueue failed
  /api/library:
    get:
      summary: Flat track list
      responses:
        '200':
          description: Track array
  /api/library/upload:
    post:
      summary: Upload audio files into MUSIC_HIVE_LIBRARY
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                path:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: '{ok, saved, skipped, count}'
  /api/artists:
    get:
      summary: Artists
      responses:
        '200':
          description: '{artists, count}'
  /api/albums:
    get:
      summary: Albums
      responses:
        '200':
          description: '{albums, count}'
  /api/tracks/{id}:
    get:
      summary: Track by id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Track
        '404':
          description: Not found
  /api/stream/{id}:
    get:
      summary: Audio stream (Range)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: q
        in: query
        description: Mobile transcode profile; omit for original media
        schema:
          type: string
          enum:
          - mobile
          - aac
          - mp3
      - name: fmt
        in: query
        description: Alias for q
        schema:
          type: string
          enum:
          - mobile
          - aac
          - mp3
      responses:
        '200':
          description: Original or transcoded audio
        '400':
          description: Invalid track id
        '404':
          description: Track or media file not found
  /api/radio/start:
    post:
      summary: Start radio session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed_track_id:
                  type: integer
      responses:
        '200':
          description: session + current + queue
  /api/play:
    post:
      summary: Fixed listen (track/artist/album/ids)
      responses:
        '200':
          description: session + tracks
  /api/events:
    post:
      summary: Playback events
      responses:
        '200':
          description: ok / next
  /api/mixes:
    get:
      summary: Mix shelves
      responses:
        '200':
          description: mixes
  /api/mixes/{kind}/play:
    post:
      summary: Play mix kind
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: session
  /api/favorites:
    get:
      summary: List favorites
      responses:
        '200':
          description: tracks/artists/albums
    post:
      summary: Add favorite
      responses:
        '200':
          description: ok
    delete:
      summary: Remove favorite
      responses:
        '200':
          description: ok
  /api/favorites/toggle:
    post:
      summary: Toggle favorite
      responses:
        '200':
          description: favorited
  /api/favorites/status:
    get:
      summary: Favorite status
      responses:
        '200':
          description: favorited bool
  /api/recommend/seed:
    get:
      summary: Similar tracks to seed
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - track
          - artist
          - album
      - name: track_id
        in: query
        schema:
          type: integer
      - name: artist
        in: query
        schema:
          type: string
      - name: album
        in: query
        schema:
          type: string
      responses:
        '200':
          description: tracks
  /api/recommend/favorites:
    get:
      summary: Recommend from favorites
      responses:
        '200':
          description: tracks/artists/albums
  /api/jobs:
    get:
      summary: List jobs
      parameters:
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: jobs
  /api/jobs/{kind}:
    post:
      summary: Enqueue job
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: job id
  /api/share/radio:
    post:
      summary: Create public continuous MP3 radio share link
      responses:
        '200':
          description: '{url, token}'
    get:
      summary: List radio share links
      responses:
        '200':
          description: '{shares, count}'
  /api/share/radio/{token}:
    delete:
      summary: Revoke share link
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok
  /api/metrics/weekly:
    get:
      summary: Seven-day listening and recommendation outcomes
      responses:
        '200':
          description: Listen, completion, diversity and explore/exploit rates
  /api/metrics/recommendations:
    get:
      summary: Recommendation latency and seven-day outcomes
      responses:
        '200':
          description: In-memory p50/p95/p99 latency plus persisted impression outcomes
  /listen/{token}:
    get:
      security: []
      summary: Continuous MP3 radio stream (public share token)
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: audio/mpeg stream
        '404':
          description: revoked or missing
        '503':
          description: ffmpeg missing or busy
  /api/openapi.json:
    get:
      security: []
      summary: OpenAPI spec
      responses:
        '200':
          description: OpenAPI JSON
  /api/status:
    get:
      summary: Player status
      responses:
        '200':
          description: Track, profile, and playback status
  /api/profile:
    get:
      summary: Taste profile
      responses:
        '200':
          description: Taste maturity, signals, and confidence
  /api/artwork/{id}:
    get:
      summary: Track artwork
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Artwork image
  /api/similar/{id}:
    get:
      summary: Similar tracks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Similar track list
  /api/reload:
    post:
      summary: Reload player index
      responses:
        '200':
          description: Reload result
  /api/session/start:
    post:
      summary: Start playback session
      responses:
        '200':
          description: Session and queue
  /api/session/jump:
    post:
      summary: Jump within fixed session
      responses:
        '200':
          description: Updated session position
  /api/now:
    get:
      summary: Current playback state
      responses:
        '200':
          description: Current track and queue
  /api/tracks/{id}/lyrics:
    get:
      summary: Track lyrics
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Lyrics state and content
  /api/later:
    get:
      summary: List listen-later tracks
      responses:
        '200':
          description: Listen-later tracks
    post:
      summary: Add listen-later track
      responses:
        '200':
          description: Added track
    delete:
      summary: Remove listen-later track
      responses:
        '200':
          description: Removed track
  /api/similar/artists:
    get:
      summary: Similar artists
      responses:
        '200':
          description: Similar artist list
  /api/similar/albums:
    get:
      summary: Similar albums
      responses:
        '200':
          description: Similar album list
  /api/discover/albums:
    get:
      summary: Discover new albums
      responses:
        '200':
          description: New album tips
  /api/discover/resurfaced:
    get:
      summary: Discover resurfaced albums
      responses:
        '200':
          description: Resurfaced catalog tips
  /api/library/rescan:
    post:
      summary: Enqueue library rescan
      responses:
        '200':
          description: Job id aliases
  /api/jobs/{id}:
    get:
      summary: Get job
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Job status
  /manifest.webmanifest:
    get:
      summary: Web app manifest
      security: []
      responses:
        '200':
          description: Web app manifest
